# docker-compose.kafka.yml — a single-node Kafka broker (KRaft, no ZooKeeper)
# for running Nova streams against a real broker locally.
#
#   docker compose -f docker-compose.kafka.yml up -d
#
# This matches what nova_lang/kafka_provider.py expects:
#   - PLAINTEXT listener on localhost:9092 (no SASL/TLS — the provider
#     does not implement SASL)
#   - auto.create.topics.enable=true so Nova stream topics are created
#     on first use (or pre-create them explicitly, see docs/v2-kafka.md)

services:
  kafka:
    image: apache/kafka:4.0.0
    container_name: nova-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
